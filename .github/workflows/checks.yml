name: Checks

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r backend/requirements.txt
      - run: python tools/check_public_release.py
      - run: python -m compileall -q backend core database exchange_engine exit signal_engine telegram_engine main.py
      - run: python -m unittest discover -s tests -p test_dashboard_auth_config.py
      - run: python -c "import runpy; ns=runpy.run_path('tests/test_teacher_protection.py'); checks=[f for n,f in ns.items() if n.startswith('test_')]; [f() for f in checks]; print(len(checks), 'teacher protection checks passed')"
      - run: python -X utf8 tests/sim_entry_fill.py
      - run: python -X utf8 tests/sim_tp2_flow.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
