# Trading Bot Dashboard - nginx 反向代理配置（可选）
#
# 场景：不想直接暴露 8000 端口，用 nginx 走 80/443，并做 WebSocket 转发。
#
# 安装步骤：
#   sudo cp deploy/ubuntu/nginx-dashboard.conf /etc/nginx/sites-available/dashboard
#   sudo ln -s /etc/nginx/sites-available/dashboard /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 域名/IP：把 server_name 换成你的域名；用 IP 访问可删除该行。

server {
    listen 80;
    server_name your-domain.com;

    # 直接访问前端构建产物（可选，更高效；否则走 proxy 让 FastAPI 托管）
    # root /opt/bot/frontend/dist;
    # index index.html;
    # location / { try_files $uri $uri/ /index.html; }
    # location /api/ { proxy_pass http://127.0.0.1:8000; }
    # location /ws { proxy_pass http://127.0.0.1:8000; proxy_http_version 1.1;
    #               proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }

    # 统一反代（推荐，最简单，包含 API 与 WebSocket）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
